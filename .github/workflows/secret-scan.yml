name: secret-scan

on:
  push:
    branches: [master]
  pull_request:

jobs:
  scan:
    name: Checkmarx 2ms Secret Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 2ms - scan working tree
        run: |
          mkdir -p results
          chmod 777 results
          docker run --rm \
            -v "$PWD":/repo \
            checkmarx/2ms \
              filesystem --path /repo \
              --report-path /repo/results/2ms.sarif \
              --ignore-on-exit results

      - name: Upload findings to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/2ms.sarif
          category: 2ms-secrets
