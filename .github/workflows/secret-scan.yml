name: secret-scan
on:
  pull_request:
  push:
    branches: [master]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets (fail-fast)
        run: |
          docker run --rm -v "$PWD":/repo checkmarx/2ms \
            git /repo \
            --ignore-on-exit results

      - name: Scan filesystem for secrets (SARIF)
        run: |
          mkdir -p artifacts && chmod 777 artifacts
          docker run --rm -v "$PWD":/repo checkmarx/2ms \
            filesystem /repo \
            --stdout-format sarif \
            --report-path /repo/artifacts/2ms.sarif \
            --ignore-on-exit results

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/2ms.sarif

